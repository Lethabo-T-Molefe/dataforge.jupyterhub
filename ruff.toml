line-length = 110
target-version = "py312"
# Members' notebooks and the generated JupyterLab config are not this repo's code.
extend-exclude = ["workspace", "config"]

[lint]
select = ["E", "F", "I", "UP", "B"]
# `ruff format` owns line length for code; long messages are kept on one line so they stay searchable.
ignore = ["E501"]
